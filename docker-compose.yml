# The runner on Phala Cloud (dstack). Everything written here is covered by the attestation; only the
# secrets come in as encrypted env (.env.tee, see scripts/swarm.sh tee-deploy). Pin the image by digest.
services:
  runner:
    image: ghcr.io/sunnesoft/swarm-runner@sha256:4f1676bab06e21d521b4762d4fed3b3bb8b2e5eff3c483f344aa2fdec6ca51f7
    restart: always
    ports:
      - "8080:8080" # /attestation, /info, /upload, the sealing page
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock # keys and quotes from the TEE
      - store:/data # sealed uploads and round decisions, on the CVM's encrypted disk
    environment:
      NEAR_RPC: https://near.drpc.org # mainnet, native USDC; fastnear and rpc.*.near.org refuse the TEE gateway (429)
      CONTRACT: swarm.hiveswarm.near
      RUNNER_ACCOUNT: runner.hiveswarm.near
      PROTOCOL_MODEL: Qwen/Qwen3.8-27B
      AUDIT_MODEL: Qwen/Qwen3.8-27B
      EMBED_MODEL: Qwen/Qwen3-Embedding-0.6B
      OVERHEAD_USD: "0.50"
      OVERHEAD_PER_AGENT_USD: "0.10"
      DAILY_BUDGET_USD: "2.00" # the most spent at NEAR AI in a UTC day; then no new work is started
      MAX_REWORKS: "2"
      BIDS: "off" # "on": bid on board tasks at the price of the team each needs
      NEARAI_API_KEY: ${NEARAI_API_KEY}
      MARKET_TOKEN: ${MARKET_TOKEN:-} # without it only orders placed in the contract are served
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
volumes:
  store:
